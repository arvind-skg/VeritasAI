databases:
  - name: veritasai-db
    databaseName: veritasai
    user: veritasai_user
    plan: free

services:
  - type: web
    name: veritasai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && (chmod -R +x node_modules/.bin 2>/dev/null || true) && npx prisma generate && npx prisma db push && npx tsc
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: veritasai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: veritasai-admin
      - key: COOL_APPLICATION_ID
        value: veritasai
      - key: ENCRYPTION_KEY
        generateValue: true
