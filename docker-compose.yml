version: '3.8'

services:
  api:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=file:./dev.db
      - COOL_APPLICATION_ID=veritasai
      - ADMIN_PASSWORD=veritasai-admin
    volumes:
      - api_data:/app/prisma

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api_data:
